# Rotas de cliente (contrato seção 6): exigem Bearer no Kong.
# A validação RS256 + escopo por CPF continua na API (guard cliente).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-api-cliente
  namespace: default
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: require-bearer
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/public
            pathType: Prefix
            backend:
              service:
                name: oficina-api-service
                port:
                  number: 80
