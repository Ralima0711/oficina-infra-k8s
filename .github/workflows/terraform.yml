name: Terraform e Kong CI/CD

on:
  push:
    branches: [homolog, main]
  pull_request:
    branches: [homolog, main]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  AWS_DEFAULT_REGION: us-east-1
  CLUSTER_NAME: oficina-mecanica-cluster
  HAS_AWS: "${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}"
  AUTH_LAMBDA_FUNCTION_NAME: ${{ secrets.AUTH_LAMBDA_FUNCTION_NAME }}

jobs:
  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

      - name: Configure AWS credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform plan
        if: env.HAS_AWS == 'true'
        env:
          TF_VAR_lab_role_arn: ${{ secrets.TF_VAR_LAB_ROLE_ARN }}
          TF_VAR_subnet_ids: ${{ secrets.TF_VAR_SUBNET_IDS }}
          TF_VAR_auth_lambda_function_name: ${{ secrets.AUTH_LAMBDA_FUNCTION_NAME }}
          TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: terraform plan -input=false -no-color

      - name: Skip plan (sem credenciais AWS)
        if: env.HAS_AWS != 'true'
        run: |
          echo "Plan ignorado: cadastre AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY nos secrets do repositório."
          echo "No AWS Academy, inclua também AWS_SESSION_TOKEN (expira com o lab)."

  apply:
    name: Terraform apply e rotas Kong
    if: github.event_name == 'push' && (github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Skip apply (sem credenciais AWS)
        if: env.HAS_AWS != 'true'
        run: |
          echo "Apply ignorado: configure os secrets AWS no repositório."

      - name: Configure AWS credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init
        if: env.HAS_AWS == 'true'
        run: terraform init -input=false

      - name: Terraform apply
        if: env.HAS_AWS == 'true'
        env:
          TF_VAR_lab_role_arn: ${{ secrets.TF_VAR_LAB_ROLE_ARN }}
          TF_VAR_subnet_ids: ${{ secrets.TF_VAR_SUBNET_IDS }}
          TF_VAR_auth_lambda_function_name: ${{ secrets.AUTH_LAMBDA_FUNCTION_NAME }}
          TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
        run: terraform apply -input=false -auto-approve -no-color

      - name: Configure kubectl
        if: env.HAS_AWS == 'true'
        run: aws eks update-kubeconfig --region us-east-1 --name ${{ env.CLUSTER_NAME }}

      - name: Wait for Kong
        if: env.HAS_AWS == 'true'
        run: kubectl wait --namespace kong --for=condition=Available deploy --all --timeout=300s

      - name: Apply Kong dummy service e plugin Bearer
        if: env.HAS_AWS == 'true'
        run: |
          kubectl apply -f k8s/dummy-auth-service.yaml
          kubectl apply -f k8s/plugin-require-bearer.yaml
          kubectl apply -f k8s/ingress-api.yaml
          kubectl apply -f k8s/ingress-api-public.yaml

      - name: Apply rota /auth (Lambda)
        if: env.HAS_AWS == 'true' && env.AUTH_LAMBDA_FUNCTION_NAME != ''
        run: |
          sed "s/AUTH_LAMBDA_FUNCTION_NAME/${AUTH_LAMBDA_FUNCTION_NAME}/g" \
            k8s/plugin-aws-lambda.yaml | kubectl apply -f -
          kubectl apply -f k8s/ingress-auth.yaml
